[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sawyer-operations"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sawyer-control>=0.1.0"]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]

[project.scripts]
sawyer-traj = "sawyer_operations.__main__:main"

[tool.setuptools]
packages = ["sawyer_operations"]
